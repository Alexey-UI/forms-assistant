apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: forms-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ycr-pull-secret
      containers:
        - name: frontend
          image: cr.yandex/crpd72em5kgv8l2e2l5k/frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: forms-assistant
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
