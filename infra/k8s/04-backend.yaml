apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: forms-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ycr-pull-secret
      initContainers:
        - name: migrate
          image: cr.yandex/crpd72em5kgv8l2e2l5k/backend:latest
          workingDir: /repo/apps/backend
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: backend-secrets
      containers:
        - name: backend
          image: cr.yandex/crpd72em5kgv8l2e2l5k/backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              memory: 400Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: forms-assistant
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
